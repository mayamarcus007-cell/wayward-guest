<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>The WayWard · Welcome</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lustria&family=Merriweather:wght@400;700&display=swap">
<style>
  :root{
    --forest:#17302C; --sage:#8FA98F; --sage-soft:#DCE6DA; --cream:#F6F2EA; --paper:#FFFFFF;
    --ink:#1E2420; --muted:#56615A; --navy:#1F2E44; --line:#D9DED6;
    --flag-bg:#F7E7E1; --flag-ink:#6E2B19;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--cream); color:var(--ink); font-family:Merriweather,Georgia,serif; font-size:17px; line-height:1.6; min-height:100vh; overflow-x:hidden; }
  .gutter{ padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
  .band{ background:var(--forest); color:var(--cream); padding-block:16px; text-align:center; }
  .wordmark{ font-family:Lustria,Georgia,serif; letter-spacing:.14em; text-transform:uppercase; font-size:18px; }
  .sub{ font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--sage-soft); margin-top:4px; }
  .wrap{ max-width:640px; margin:0 auto; padding-block:18px 40px; }
  .progress{ display:flex; gap:6px; margin-bottom:18px; }
  .progress span{ flex:1; height:4px; border-radius:2px; background:var(--line); }
  .progress span.on{ background:var(--forest); }
  .card{ background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:24px 20px 22px; }
  .kicker{ font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; }
  h1{ font-family:Lustria,Georgia,serif; font-weight:400; font-size:29px; line-height:1.2; margin:0 0 10px; text-wrap:balance; }
  .lede{ color:var(--muted); margin:0 0 18px; font-size:16px; }
  label.f{ display:block; font-size:14px; color:var(--muted); margin:16px 0 6px; }
  input,textarea{ width:100%; font:inherit; font-size:17px; color:var(--ink); background:var(--cream); border:1px solid var(--line); border-radius:6px; padding:14px; }
  textarea{ min-height:96px; resize:vertical; }
  input:focus,textarea:focus{ outline:2px solid var(--sage); outline-offset:1px; background:var(--paper); }
  .err{ color:var(--flag-ink); font-size:14px; min-height:22px; margin:10px 0 0; }
  .opts{ display:grid; gap:10px; margin-top:4px; }
  .opt{ width:100%; min-height:62px; text-align:left; font:inherit; font-size:16px; line-height:1.35; color:var(--navy); background:var(--paper); border:1.5px solid var(--navy); border-radius:6px; padding:12px 16px; cursor:pointer; }
  .opt small{ display:block; color:var(--muted); font-size:13px; margin-top:2px; }
  .opt[aria-pressed="true"]{ background:var(--navy); color:#FFFFFF; }
  .opt[aria-pressed="true"] small{ color:var(--sage-soft); }
  .btn,.opt,.link{ -webkit-tap-highlight-color:transparent; }
  :focus-visible{ outline:2px solid var(--sage); outline-offset:2px; }
  .actions{ display:grid; gap:10px; margin-top:22px; }
  .btn{ width:100%; min-height:56px; font:inherit; font-size:16px; letter-spacing:.06em; text-transform:uppercase; color:#FFFFFF; background:var(--navy); border:0; border-radius:6px; cursor:pointer; }
  .btn:disabled{ opacity:.6; cursor:wait; }
  .btn.ghost{ background:transparent; color:var(--navy); border:1.5px solid var(--navy); }
  .letter{ font-size:17px; margin:0 0 12px; }
  .note{ background:var(--sage-soft); color:var(--forest); border-radius:6px; padding:14px 16px; font-size:15px; }
  .flag{ background:var(--flag-bg); color:var(--flag-ink); border-radius:8px; padding:20px; font-size:16px; white-space:pre-line; }
  .summary{ display:grid; gap:12px; margin:16px 0; padding:16px; border:1px solid var(--line); border-radius:8px; background:var(--cream); }
  .summary > div{ display:grid; grid-template-columns:84px minmax(0,1fr); gap:12px; font-size:16px; line-height:1.4; }
  .summary span{ color:var(--muted); font-size:14px; padding-top:2px; }
  .summary b{ font-weight:700; overflow-wrap:anywhere; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>

<header class="band"><div class="gutter">
  <div class="wordmark">The Supernova Life</div>
  <div class="sub">The WayWard</div>
</div></header>

<main class="wrap gutter">
  <div class="progress" id="progress" hidden></div>
  <section class="card" id="screen" aria-live="polite"></section>
</main>

<script>
(function(){
  /* ---- Configuration: set before publishing ---- */
  var API = 'https://mayamarcus007.app.n8n.cloud/webhook';
  var KEY = 'e36557fa2f64dc94cda109d022a14209';          // shared key, must match the n8n check
  var TIMEZONE = 'Asia/Dubai';             // UAE time, GST (UTC+4)

  var CRISIS = /suicid|kill myself|end my life|end it all|self[- ]?harm|hurt myself|cut myself|overdose|want to die|don.?t want to (live|be here|wake up)|no reason to live|better off dead/i;
  var STEPS = ['name','reach','gathering','location','calling','referred','book'];
  var GATHERINGS = {
    abudhabi: { label: 'The Abu Dhabi Gathering', when: 'Monday 23 November · 8:30 pm UAE time (GST)' },
    online:   { label: 'The online gathering',    when: 'Wednesday 30 December · 8:30 pm UAE time (GST)' },
    both:     { label: 'Both, if I may',          when: 'Both gatherings' }
  };

  var screen = document.getElementById('screen');
  var progress = document.getElementById('progress');
  var s = {};
  var current = 'welcome';
  var trail = [];
  var sessionId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
  var pending = [];

  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function isCrisis(t){ return CRISIS.test(t || ''); }
  function go(step){ trail.push(current); current = step; render(); }
  function back(){ if (trail.length){ current = trail.pop(); render(); } }
  function restart(){ s = {}; trail = []; current = 'welcome'; render(); }
  function crisis(){ save('crisis_flag'); trail.push(current); current = 'crisis'; render(); }

  function normalizeUAE(v){
    var d = (v || '').replace(/[\s\-()]/g, '');
    if (d.indexOf('00971') === 0) d = '+' + d.slice(2);
    if (d.indexOf('971') === 0) d = '+' + d;
    if (d.indexOf('0') === 0 && d.length === 10) d = '+971' + d.slice(1);
    return /^\+9715\d{8}$/.test(d) ? d : '';
  }
  function fmtSlot(iso){
    return new Date(iso).toLocaleString('en-GB', { timeZone: TIMEZONE, weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', hour12: false }) + ' UAE time (GST)';
  }
  function tier(){
    if (s.booked) return 'Warm, booked';
    if (s.calling) return 'Warm';
    return 'Curious';
  }

  /* Every step is saved to Sara's sheet as it happens. Returns the server's status. */
  function save(stage, extra){
    var body = Object.assign({
      stage: stage,
      session_id: sessionId,
      at: new Date().toISOString(),
      full_name: s.name || '',
      whatsapp: s.wa || '',
      email: s.email || '',
      gathering: s.gathering || '',
      location: s.location || '',
      calling: s.calling || '',
      craving: s.craving || '',
      referred: s.referred || '',
      share_more: s.more || '',
      tier: tier(),
      slot: s.slot ? s.slot.start : ''
    }, extra || {});
    pending.push(body);
    return flush();
  }
  function flush(){
    var item = pending[0];
    if (!item) return Promise.resolve({ status: 'ok' });
    return fetch(API + '/wayward-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-wayward-key': KEY },
      body: JSON.stringify(item)
    }).then(function(r){ return r.json(); }).then(function(j){
      pending.shift();
      return j;
    }).catch(function(){
      return { status: 'offline' };   // keep the item queued; the next step retries it
    });
  }

  function slotsFetch(){
    return fetch(API + '/wayward-slots', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-wayward-key': KEY },
      body: JSON.stringify({ session_id: sessionId })
    }).then(function(r){ return r.json(); });
  }
  function bookFetch(slot){
    return fetch(API + '/wayward-book', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-wayward-key': KEY },
      body: JSON.stringify({
        session_id: sessionId,
        start: slot.start, end: slot.end,
        name: s.name || '', first_name: s.first || '',
        email: s.email || '', phone: s.wa || '',
        tier: tier(), note: s.calling || ''
      })
    }).then(function(r){ return r.json(); });
  }

  function render(){
    screen.innerHTML = '';
    var q = STEPS.indexOf(current);
    progress.hidden = q < 0;
    progress.innerHTML = '';
    if (q >= 0) STEPS.forEach(function(_, i){ progress.appendChild(el('span', i <= q ? 'on' : '')); });
    BUILD[current]();
  }

  function head(kicker, title, lede){
    screen.appendChild(el('p', 'kicker', kicker));
    screen.appendChild(el('h1', '', title));
    if (lede) screen.appendChild(el('p', 'lede', lede));
  }
  function field(text, node){ screen.appendChild(el('label', 'f', text)); screen.appendChild(node); }
  function input(type, ph, val){ var i = el('input'); i.type = type; i.placeholder = ph; i.value = val || ''; return i; }
  function area(ph, val){ var t = el('textarea'); t.placeholder = ph; t.value = val || ''; return t; }
  function button(label, cls, fn){ var b = el('button', cls, label); b.type = 'button'; b.onclick = fn; return b; }
  function actions(){ var a = el('div', 'actions'); screen.appendChild(a); return a; }
  function backButton(a){ if (trail.length) a.appendChild(button('Back', 'btn ghost', back)); }
  function choices(list, selected, onPick){
    var box = el('div', 'opts');
    list.forEach(function(o){
      var b = el('button', 'opt');
      b.type = 'button';
      b.setAttribute('aria-pressed', String(selected === o.key));
      b.appendChild(document.createTextNode(o.label));
      if (o.when) b.appendChild(el('small', '', o.when));
      b.onclick = function(){ onPick(o.key); };
      box.appendChild(b);
    });
    screen.appendChild(box);
    return box;
  }

  var BUILD = {
    welcome: function(){
      head('Welcome', 'Hello, and welcome to The WayWard.', 'Before you meet Sara, I would love to get to know you a little. It takes about three minutes, and you can pause at any time.');
      screen.appendChild(el('p', 'lede', 'I am Sara\'s gentle assistant. I am automated, and I want to be honest about that from the start.'));
      actions().appendChild(button('Begin', 'btn', function(){ go('name'); }));
    },

    name: function(){
      head('About you', 'What may we call you?', 'Your first name is perfectly lovely.');
      var i = input('text', 'Your name', s.name); field('Name', i);
      var e = el('p', 'err', ''); screen.appendChild(e);
      var a = actions();
      a.appendChild(button('Continue', 'btn', function(){
        var v = i.value.trim();
        if (!v){ e.textContent = 'Please share a name, so Sara knows who she is meeting.'; return; }
        if (isCrisis(v)) return crisis();
        s.name = v.slice(0, 60); s.first = v.split(/\s+/)[0];
        go('reach');
      }));
      backButton(a);
    },

    reach: function(){
      head('Staying in touch', 'Where can Sara\'s team reach you?', 'Only Sara\'s team sees these. Your WhatsApp number is for your details and one gentle reminder.');
      var w = input('tel', '+971 50 123 4567', s.wa); field('WhatsApp number (UAE)', w);
      var m = input('email', 'you@example.com', s.email); field('Email address', m);
      var e = el('p', 'err', ''); screen.appendChild(e);
      var a = actions();
      a.appendChild(button('Continue', 'btn', function(){
        var p = normalizeUAE(w.value);
        if (!p){ e.textContent = 'Please share a UAE mobile number, such as +971 50 123 4567.'; return; }
        var em = m.value.trim();
        if (!/^\S+@\S+\.\S+$/.test(em)){ e.textContent = 'That email does not look quite right. Could you check it?'; return; }
        s.wa = p; s.email = em;
        save('reach_done');
        go('gathering');
      }));
      backButton(a);
    },

    gathering: function(){
      head('The gatherings', 'The WayWard opens its doors twice in 2026.', 'Both gatherings are open to women who are new to us. Which one calls to you?');
      choices([
        { key: 'abudhabi', label: GATHERINGS.abudhabi.label, when: GATHERINGS.abudhabi.when },
        { key: 'online',   label: GATHERINGS.online.label,   when: GATHERINGS.online.when },
        { key: 'both',     label: GATHERINGS.both.label,     when: GATHERINGS.both.when }
      ], s.gathering, function(k){ s.gathering = k; save('gathering_chosen'); go('location'); });
      var a = actions(); backButton(a);
    },

    location: function(){
      head('Your journey', 'Will you join us in Abu Dhabi, or from elsewhere in the world?');
      choices([
        { key: 'abudhabi', label: 'In Abu Dhabi' },
        { key: 'intl',     label: 'I am based internationally, and I will join online' }
      ], s.location, function(k){ s.location = k; save('location_chosen'); go('calling'); });
      var a = actions(); backButton(a);
    },

    calling: function(){
      head('In your words', 'What is calling you to join The WayWard?', 'A few words is lovely. You can leave either box blank.');
      var c = area('Whatever is in your heart…', s.calling); field('What is calling you?', c);
      var k = area('Rest, friendship, room to create…', s.craving); field('And what are you most craving right now?', k);
      var e = el('p', 'err', ''); screen.appendChild(e);
      var a = actions();
      a.appendChild(button('Continue', 'btn', function(){
        var x = c.value.trim(), y = k.value.trim();
        if (isCrisis(x) || isCrisis(y)) return crisis();
        s.calling = x; s.craving = y;
        save('calling_done').then(function(r){
          if (r && r.status === 'crisis') return crisis();
          go('referred');
        });
      }));
      backButton(a);
    },

    referred: function(){
      head('Almost there', 'Were you referred to The WayWard by someone?');
      var box = choices([
        { key: 'yes', label: 'Yes' },
        { key: 'no',  label: 'No' }
      ], s.referred, function(k){
        s.referred = k;
        Array.prototype.forEach.call(box.children, function(b, i){ b.setAttribute('aria-pressed', String(['yes','no'][i] === k)); });
      });
      var t = area('Anything at all… (optional)', s.more); field('Is there anything else you would love to share?', t);
      var e = el('p', 'err', ''); screen.appendChild(e);
      var a = actions();
      a.appendChild(button('Continue', 'btn', function(){
        if (!s.referred){ e.textContent = 'Please choose yes or no.'; return; }
        var v = t.value.trim();
        if (isCrisis(v)) return crisis();
        s.more = v;
        save('referred_done').then(function(r){
          if (r && r.status === 'crisis') return crisis();
          go('book');
        });
      }));
      backButton(a);
    },

    book: function(){
      if (s.calling){
        head('Time with Sara', 'Sara would love to meet you.', 'Choose a short, unhurried conversation with her before the gathering. Just the two of you.');
      } else {
        head('Time with Sara', 'If you would like to meet Sara first, a time is here.', 'Just the two of you, and no pressure at all.');
      }
      var list = el('div', 'opts');
      screen.appendChild(list);
      list.appendChild(el('p', 'lede', 'Finding times that are free…'));
      var e = el('p', 'err', ''); screen.appendChild(e);
      var a = actions();
      a.appendChild(button('Not yet, thank you', 'btn ghost', function(){
        save('not_yet').then(function(){ s.slot = null; go('done'); });
      }));
      backButton(a);

      slotsFetch().then(function(r){
        list.innerHTML = '';
        var slots = (r && r.slots) || [];
        if (!slots.length){ e.textContent = 'There are no free times in the next two weeks. Choose "Not yet" and Sara will be in touch by email to find one.'; return; }
        slots.forEach(function(sl){
          var b = el('button', 'opt'); b.type = 'button';
          b.appendChild(document.createTextNode(fmtSlot(sl.start)));
          b.appendChild(el('small', '', 'Hold this time'));
          b.onclick = function(){
            b.disabled = true;
            bookFetch(sl).then(function(res){
              if (res && res.status === 'booked'){
                s.slot = sl; s.booked = true;
                save('booked', { slot: sl.start }).then(function(){ go('done'); });
              } else if (res && res.status === 'taken'){
                e.textContent = 'That time has just been taken. Please choose another.';
                render();
              } else {
                e.textContent = 'We could not hold that time just now. Please try again, or choose "Not yet" and Sara will be in touch by email.';
                b.disabled = false;
              }
            }).catch(function(){
              e.textContent = 'We could not reach Sara\'s calendar just now. Please try again in a moment.';
              b.disabled = false;
            });
          };
          list.appendChild(b);
        });
      }).catch(function(){
        list.innerHTML = '';
        e.textContent = 'We could not reach Sara\'s calendar just now. Please try again in a moment, or choose "Not yet".';
      });
    },

    done: function(){
      if (s.slot){
        screen.appendChild(el('p', 'kicker', 'Held for you'));
        screen.appendChild(el('h1', '', 'Thank you, ' + s.first + '.'));
        screen.appendChild(el('p', 'letter', 'Dear ' + s.first + ', your conversation with Sara is confirmed. It is a short, unhurried time, just the two of you.'));
        var sum = el('div', 'summary');
        [['When', fmtSlot(s.slot.start)], ['Format', 'Video call on Google Meet'], ['Sent to', s.email]].forEach(function(r){
          var row = el('div', '');
          row.appendChild(el('span', '', r[0]));
          row.appendChild(el('b', '', r[1]));
          sum.appendChild(row);
        });
        screen.appendChild(sum);
        screen.appendChild(el('p', 'note', 'Check your inbox and your spam folder. If the invitation does not arrive within a few minutes, reply to the email from Sara\'s team.'));
      } else {
        screen.appendChild(el('p', 'kicker', 'Thank you'));
        screen.appendChild(el('h1', '', 'Thank you, ' + s.first + '.'));
        screen.appendChild(el('p', 'lede', 'You are seen. Sara will read your words herself before you meet. Whenever you are ready, a time with her is always open.'));
      }
      actions().appendChild(button('Start again', 'btn ghost', restart));
    },

    crisis: function(){
      screen.appendChild(el('div', 'flag', 'I am so glad you wrote to us, ' + (s.first || 'friend') + '. I am an automated assistant, so I cannot hold you the way a person can, and I do not want you to be alone with this.\n\nIf you might hurt yourself, please call 999 or 112 now. If you are in the UAE, please reach someone you trust right away.\n\nSara has been alerted, and she will reach out to you personally.'));
      actions().appendChild(button('Start again', 'btn ghost', restart));
    }
  };

  render();
})();
</script>
</body>
</html>
